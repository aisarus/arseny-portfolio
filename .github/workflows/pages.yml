name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static Pages site
        env:
          PAGES_STATIC_BUILD: "true"
        run: bun run build

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -f dist/client/cv/index.html
          test -f dist/client/robots.txt
          test -f dist/client/sitemap.xml
          test -f dist/client/llms.txt
          test -f dist/client/profile.json
          grep -q "Arseniy Perel" dist/client/index.html
          grep -q "/arseny-portfolio/" dist/client/index.html
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
