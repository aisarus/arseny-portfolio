name: Verify portfolio build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build static verification target
        env:
          PAGES_STATIC_BUILD: "true"
        run: bun run build

      - name: Verify recruiter-facing output
        run: |
          test -f dist/client/index.html
          test -f dist/client/cv/index.html
          test -f dist/client/cv.pdf
          test -f dist/client/og-card.png
          test -f dist/client/robots.txt
          test -f dist/client/sitemap.xml
          test -f dist/client/llms.txt
          test -f dist/client/profile.json
          test -f dist/client/about/index.html
          test -f dist/client/ai-automation/index.html
          test -f dist/client/work/aegis/index.html
          test -f dist/client/work/lamdan/index.html
          test -f dist/client/work/botforge/index.html
          grep -q "Arseniy Perel" dist/client/index.html
          grep -q "arseny-perel.lovable.app" dist/client/index.html
          grep -q "arseny-perel.lovable.app" dist/client/sitemap.xml
          grep -q "linkedin.com" dist/client/index.html
          grep -q "Contact me" dist/client/index.html
          grep -q "_vercel/insights/script.js" dist/client/index.html
          grep -q "_vercel/speed-insights/script.js" dist/client/index.html
          grep -q "Aegis Operator" dist/client/work/aegis/index.html
          grep -q "Lamdan" dist/client/work/lamdan/index.html
          grep -q "BotForge" dist/client/work/botforge/index.html
